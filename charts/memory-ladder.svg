<text x='20' y='530' font-size='10.5' fill='#5c6675'>Free-RAM triple is head / worker-1 / worker-2. The binding limit is host RAM, not the device: the device still reported 111.3-111.8 GiB free at every rung,</text>
<text x='20' y='546' font-size='10.5' fill='#5c6675'>so the device ceiling is around 0.915. Our stop rule: MemAvailable stays above 2 GiB and the head node does not swap heavily.</text>
